<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pink Pong | Juego de Ping-Pong</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="game-container">

        <header>
            <p class="eyebrow">ARCADE CLÁSICO · EDICIÓN ROSA</p>
            <h1>Pink <span>Pong</span></h1>
            <p>¡Cinco pelotas, mucha diversión! 💗</p>
        </header>

        <section class="game-panel">

            <canvas
                id="gameCanvas"
                width="800"
                height="600"
                aria-label="Juego Pink Pong">
            </canvas>

            <div class="game-actions">
                <button id="restartButton" type="button">
                    ↻ Reiniciar partida
                </button>
            </div>

        </section>

        <p class="instructions">
            Usa las flechas ↑ y ↓ para mover tu paleta.
        </p>

    </main>

    <script src="game.js"></script>

</body>
</html>
