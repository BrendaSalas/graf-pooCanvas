<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pink Pong | Juego de Ping-Pong</title>

    <!-- Conexión con el archivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

        <header>
            <h1>Pink <span>Pong</span></h1>
            <p>¡Cinco pelotas, mucha diversión! 💗</p>
        </header>

        <canvas
            id="gameCanvas"
            width="800"
            height="600">
        </canvas>

        <p class="instructions">
            Usa las flechas ↑ y ↓ para mover tu paleta.
        </p>

    </main>

    <!-- Conexión con el archivo JavaScript -->
    <script src="game.js"></script>

</body>
</html>
